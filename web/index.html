<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flights Price Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-2:#eb6834; --good:#006300;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --good:#0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --series-1:#3987e5; --series-2:#d95926; --good:#0ca30c;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--page); color:var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 64px; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13.5px; }
  .theme-btn {
    border:1px solid var(--border); background:var(--surface-1); color:var(--text-secondary);
    border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  .theme-btn:hover { color:var(--text-primary); }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:22px 0 6px; }
  .tile { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .tile .label { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; }
  .tile .value { font-size:26px; margin-top:6px; letter-spacing:-0.02em; }
  .tile .note { color:var(--text-secondary); font-size:12px; margin-top:4px; }

  .controls { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin:26px 0 10px; }
  .ctl label { display:block; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
  select {
    background:var(--surface-1); color:var(--text-primary); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:14px; min-width:210px; font-family:inherit;
  }
  .segmented { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .segmented button {
    background:var(--surface-1); color:var(--text-secondary); border:0; border-left:1px solid var(--border);
    padding:8px 13px; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .segmented button:first-child { border-left:0; }
  .segmented button[aria-pressed="true"] { background:var(--series-1); color:#fff; }
  .segmented button:not([aria-pressed="true"]):hover { color:var(--text-primary); }

  .columns { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; }
  @media (max-width:840px) { .columns { grid-template-columns:1fr; } }
  .col { min-width:0; }
  .coltitle { font-size:15px; margin:14px 0 2px; display:flex; align-items:center; gap:8px; }
  .coltitle .arrow { color:var(--series-1); font-weight:600; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:18px 18px 12px; margin-top:20px; }
  .col .card { margin-top:12px; }
  .card .subctl { margin-bottom:10px; }
  .card .subctl select { min-width:170px; }
  .card h2 { font-size:15px; margin:0 0 2px; }
  .card .cap { color:var(--text-secondary); font-size:12.5px; margin:0 0 12px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin:2px 0 10px; }
  .legend .item { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-secondary); }
  .legend .dot { width:11px; height:11px; border-radius:50%; }
  .chart-host { position:relative; width:100%; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .tabular { font-variant-numeric: tabular-nums; }

  .tooltip {
    position:absolute; pointer-events:none; opacity:0; transition:opacity .08s;
    background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
    padding:9px 11px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,0.14); min-width:150px; z-index:5;
  }
  .tooltip .tt-date { font-weight:600; margin-bottom:6px; }
  .tooltip .tt-row { display:flex; align-items:center; gap:7px; margin-top:3px; }
  .tooltip .tt-row .dot { width:9px; height:9px; border-radius:50%; }
  .tooltip .tt-price { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .tooltip .tt-meta { color:var(--muted); font-size:11px; margin-top:5px; }

  details { margin-top:12px; }
  summary { cursor:pointer; color:var(--text-secondary); font-size:12.5px; }
  table { border-collapse:collapse; width:100%; margin-top:10px; font-size:12.5px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--grid); }
  th { color:var(--muted); font-weight:600; }
  td.num { text-align:right; }
  .empty { color:var(--text-secondary); font-size:13.5px; padding:26px 4px; }
  .foot { color:var(--muted); font-size:12px; margin-top:26px; line-height:1.55; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Flights Price Dashboard</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">◐ Theme</button>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="controls">
    <div class="ctl">
      <label for="city">City</label>
      <select id="city"></select>
    </div>
    <div class="ctl">
      <label>Currency</label>
      <div class="segmented" id="currency" role="group" aria-label="Currency">
        <button type="button" data-ccy="GBP" aria-pressed="true">GBP £</button>
        <button type="button" data-ccy="EUR" aria-pressed="false">EUR €</button>
        <button type="button" data-ccy="CZK" aria-pressed="false">CZK Kč</button>
      </div>
      <div class="sub" id="fxnote" style="font-size:11.5px;margin-top:5px;color:var(--muted)"></div>
    </div>
  </div>

  <div class="columns" id="columns"></div>

  <p class="foot">
    Prices scraped daily from Ryanair &amp; Kiwi.com and stored append-only, so history
    grows over time. Data updates once a day. Fares in GBP, converted with ECB rates.
  </p>
</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const HUB = "STN";
const SOURCES = [
  { key: "ryanair", name: "Ryanair", varName: "--series-1" },
  { key: "kiwi",    name: "Kiwi.com", varName: "--series-2" },
];
const DIRS = [ { S: "out" }, { S: "in" } ];
const fmtDate = iso => {
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-GB", { day:"numeric", month:"short" });
};

// Currency: JSON prices are GBP; convert for display with today's ECB rates.
const FALLBACK_RATES = { date:"", approx:true, rates:{ GBP:1, EUR:1.17, CZK:28.3 } };
let RATES = FALLBACK_RATES;
let CCY = "GBP";
const rate = () => RATES.rates[CCY] || 1;
const convert = gbp => gbp * rate();
const fmt = v => CCY === "CZK" ? Math.round(v).toLocaleString() + " Kč"
                               : (CCY === "EUR" ? "€" : "£") + v.toFixed(2);
const money = gbp => fmt(convert(gbp));
const fmtAxis = v => {
  const c = v >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1) + "k" : String(Math.round(v));
  return CCY === "CZK" ? c + " Kč" : (CCY === "EUR" ? "€" : "£") + c;
};

let SUMMARY = null;         // summary.json
const CITYCACHE = {};       // city -> parsed city JSON
let CURRENT = null;         // currently selected city's data
let state = { city: null, dep: { out: null, in: null } };

boot();
async function boot() {
  let summary, rates;
  try { summary = await (await fetch("data/summary.json", {cache:"no-store"})).json(); }
  catch { document.getElementById("subtitle").textContent = "Could not load data (data/summary.json)."; return; }
  try {
    const j = await (await fetch("https://api.frankfurter.dev/v1/latest?base=GBP&symbols=CZK,EUR")).json();
    rates = { date: j.date, approx:false, rates: { GBP:1, ...j.rates } };
  } catch { rates = FALLBACK_RATES; }
  SUMMARY = summary; RATES = rates;
  setupCurrency();
  await init();
}

function setupCurrency() {
  const note = document.getElementById("fxnote");
  note.textContent = RATES.approx ? "approx rates (offline)" : `ECB rates ${RATES.date}`;
  document.querySelectorAll("#currency button").forEach(btn => {
    btn.addEventListener("click", () => {
      CCY = btn.dataset.ccy;
      document.querySelectorAll("#currency button").forEach(b =>
        b.setAttribute("aria-pressed", String(b === btn)));
      if (CURRENT) { buildKpis(); render(); }
    });
  });
}

async function init() {
  buildKpis();
  const sel = document.getElementById("city");
  SUMMARY.cities.forEach(c => { const o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });
  state.city = SUMMARY.cities[0];
  sel.value = state.city;
  sel.addEventListener("change", async () => {
    state.city = sel.value; state.dep = { out:null, in:null };
    await loadCity(state.city); render();
  });

  buildColumns();

  const [dmin, dmax] = SUMMARY.flightDateRange;
  const n = SUMMARY.stats.scrapes;
  document.getElementById("subtitle").textContent =
    `${SUMMARY.stats.rows.toLocaleString()} priced observations · flights ${fmtDate(dmin)} – ${fmtDate(dmax)} · ${n} scrape${n>1?"s":""}`;

  await loadCity(state.city);
  render();
  window.addEventListener("resize", render);
}

async function loadCity(city) {
  if (!CITYCACHE[city]) {
    CITYCACHE[city] = await (await fetch(`data/${city}.json`, {cache:"no-store"})).json();
  }
  CURRENT = CITYCACHE[city];
}

function buildKpis() {
  const s = SUMMARY.stats, c = s.cheapest;
  const tiles = [
    { label:"Observations", value:s.rows.toLocaleString() },
    { label:"Routes tracked", value:s.routes },
    { label:"Scrapes so far", value:s.scrapes, note: s.scrapes===1 ? "history grows daily" : "" },
    { label:"Cheapest fare seen", value: money(c.price),
      note: `${c.origin}→${c.destination} · ${fmtDate(c.flight_date)} · ${c.airline}` },
  ];
  document.getElementById("kpis").innerHTML = tiles.map(t =>
    `<div class="tile"><div class="label">${t.label}</div>
     <div class="value tabular">${t.value}</div>
     ${t.note ? `<div class="note">${t.note}</div>` : ""}</div>`).join("");
}

function buildColumns() {
  document.getElementById("columns").innerHTML = DIRS.map(({S}) => `
    <div class="col">
      <h3 class="coltitle" id="title_${S}"></h3>
      <div class="card">
        <h2>Cheapest fare by departure date</h2>
        <p class="cap" id="cap1_${S}"></p>
        <div class="legend" id="legend1_${S}"></div>
        <div class="chart-host" id="host1_${S}"></div>
        <details><summary>Show data table</summary><div id="table1_${S}"></div></details>
      </div>
      <div class="card">
        <h2>Price history for one departure date</h2>
        <div class="ctl subctl"><label for="depdate_${S}">Departure date</label><select id="depdate_${S}"></select></div>
        <p class="cap" id="cap2_${S}"></p>
        <div class="legend" id="legend2_${S}"></div>
        <div class="chart-host" id="host2_${S}"></div>
        <details><summary>Show data table</summary><div id="table2_${S}"></div></details>
      </div>
    </div>`).join("");
  DIRS.forEach(({S}) => {
    document.getElementById(`depdate_${S}`).addEventListener("change", e => {
      state.dep[S] = e.target.value; renderColumn(S);
    });
  });
}

// Build a source→Map(flight_date→{price,meta}) for the latest scrape (chart 1).
function fareMaps(leg) {
  const out = {};
  SOURCES.forEach(s => {
    const m = new Map(), f = leg.fare[s.key] || {};
    for (const fd in f) m.set(fd, { price:f[fd].p, dep:f[fd].dep, fn:f[fd].fn, air:f[fd].air });
    out[s.key] = m;
  });
  return out;
}
// Build a source→Map(scrape_date→{price,meta}) for one flight_date (chart 2).
function histMaps(leg, fd) {
  const out = {};
  SOURCES.forEach(s => {
    const m = new Map();
    const h = (leg.hist[s.key] || {})[fd] || {};
    const meta = (leg.fare[s.key] || {})[fd] || {};
    for (const sd in h) m.set(sd, { price:h[sd], dep:meta.dep||"", fn:meta.fn||"", air:meta.air||"" });
    out[s.key] = m;
  });
  return out;
}

function render() { DIRS.forEach(({S}) => renderColumn(S)); }

function renderColumn(S) {
  const leg = CURRENT.legs[S];
  const o = leg.origin, d = leg.destination, route = `${o}→${d}`;
  const latest = CURRENT.latestScrape;
  document.getElementById(`title_${S}`).innerHTML =
    `<span class="arrow">${o} → ${d}</span>` +
    `<span style="color:var(--muted);font-size:12.5px;font-weight:400">${S === "out" ? "outbound" : "return"}</span>`;

  // Chart 1: cheapest fare by departure date (latest scrape)
  const g1 = fareMaps(leg);
  const xs1 = leg.flightDates.slice();
  document.getElementById(`cap1_${S}`).textContent =
    `${route} · latest scrape ${fmtDate(latest)}. Lowest direct fare offered for each departure date.`;
  drawChart(`host1_${S}`, `legend1_${S}`, `table1_${S}`, xs1, g1, "Departure date");

  // Chart 2: price history for one departure date (across scrape dates)
  refreshDepDates(S, leg);
  const fd = state.dep[S];
  const g2 = fd ? histMaps(leg, fd) : {};
  const xs2 = fd ? [...new Set(SOURCES.flatMap(s => [...(g2[s.key]||new Map()).keys()]))].sort() : [];
  document.getElementById(`cap2_${S}`).textContent = fd
    ? `${route} · departing ${fmtDate(fd)} ${fd.slice(0,4)}. How its lowest fare moves each time we scrape.`
    : "No data for this selection.";
  drawChart(`host2_${S}`, `legend2_${S}`, `table2_${S}`, xs2, g2, "Scrape date");
}

function refreshDepDates(S, leg) {
  const dates = leg.flightDates;
  const sel = document.getElementById(`depdate_${S}`);
  sel.innerHTML = "";
  dates.forEach(dt => { const op=document.createElement("option"); op.value=dt; op.textContent=fmtDate(dt)+" "+dt.slice(0,4); sel.appendChild(op); });
  if (!dates.includes(state.dep[S])) state.dep[S] = dates[Math.floor(dates.length/2)] || dates[0] || null;
  sel.value = state.dep[S];
}

function renderLegend(id, activeKeys) {
  document.getElementById(id).innerHTML = SOURCES.filter(s=>activeKeys.has(s.key)).map(s =>
    `<span class="item"><span class="dot" style="background:var(${s.varName})"></span>${s.name}</span>`).join("");
}

function niceRange(min, max) {
  if (min === max) { min -= 5; max += 5; }
  const pad = (max - min) * 0.12;
  let lo = Math.max(0, min - pad), hi = max + pad;
  const step = Math.pow(10, Math.floor(Math.log10(hi - lo))) / 2 || 1;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  return [lo, hi];
}

function drawChart(hostId, legendId, tableId, xs, groups, xTitle) {
  const host = document.getElementById(hostId);
  host.innerHTML = "";
  const active = new Set(SOURCES.filter(s => groups[s.key] && groups[s.key].size).map(s=>s.key));
  renderLegend(legendId, active);

  if (!xs.length || !active.size) {
    host.innerHTML = `<div class="empty">No data for this selection.</div>`;
    document.getElementById(tableId).innerHTML = "";
    return;
  }

  const W = host.clientWidth || 500, H = 320;
  const M = { t:14, r:58, b:34, l:54 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;

  const xIndex = new Map(xs.map((x,i)=>[x,i]));
  const xAt = x => xs.length===1 ? M.l + iw/2 : M.l + (xIndex.get(x)/(xs.length-1))*iw;
  let vmin=Infinity, vmax=-Infinity;
  SOURCES.forEach(s => (groups[s.key]||new Map()).forEach(v => { const p=convert(v.price); if(p<vmin)vmin=p; if(p>vmax)vmax=p; }));
  const [ylo, yhi] = niceRange(vmin, vmax);
  const yAt = v => M.t + ih - ((v - ylo)/(yhi - ylo))*ih;

  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const add = (tag, attrs, style) => { const e=document.createElementNS(SVGNS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); if(style)e.setAttribute("style",style); svg.appendChild(e); return e; };

  const yticks = 5;
  for (let i=0;i<=yticks;i++){
    const v = ylo + (yhi-ylo)*i/yticks, y = yAt(v);
    add("line", {x1:M.l, y1:y, x2:M.l+iw, y2:y}, "stroke:var(--grid);stroke-width:1");
    const t = add("text", {x:M.l-8, y:y+3.5, "text-anchor":"end"}, "fill:var(--muted);font-size:11px");
    t.textContent = fmtAxis(v);
  }
  add("line", {x1:M.l, y1:M.t+ih, x2:M.l+iw, y2:M.t+ih}, "stroke:var(--baseline);stroke-width:1");

  const nT = Math.min(6, xs.length);
  for (let i=0;i<nT;i++){
    const idx = xs.length===1 ? 0 : Math.round(i*(xs.length-1)/(nT-1));
    const x = xAt(xs[idx]);
    const t = add("text", {x, y:M.t+ih+18, "text-anchor":"middle"}, "fill:var(--muted);font-size:11px");
    t.textContent = fmtDate(xs[idx]);
  }

  SOURCES.forEach(s => {
    if (!active.has(s.key)) return;
    const m = groups[s.key];
    const pts = xs.filter(x=>m.has(x)).map(x => ({x, px:xAt(x), py:yAt(convert(m.get(x).price))}));
    if (!pts.length) return;
    const dAttr = pts.map((p,i)=>(i?"L":"M")+p.px+" "+p.py).join(" ");
    add("path", {d:dAttr, fill:"none"}, `stroke:var(${s.varName});stroke-width:2;stroke-linejoin:round;stroke-linecap:round`);
    if (pts.length <= 14) pts.forEach(p => add("circle", {cx:p.px, cy:p.py, r:3.5}, `fill:var(${s.varName})`));
    const last = pts[pts.length-1];
    add("circle", {cx:last.px, cy:last.py, r:3.5}, `fill:var(${s.varName})`);
    const lbl = add("text", {x:last.px+7, y:last.py+3.5}, "fill:var(--text-secondary);font-size:11.5px");
    lbl.textContent = s.name;
  });

  const cross = add("line", {x1:0,y1:M.t,x2:0,y2:M.t+ih}, "stroke:var(--baseline);stroke-width:1;opacity:0");
  const hoverDots = SOURCES.map(()=>add("circle",{r:5,style:"opacity:0"}));
  const overlay = add("rect", {x:M.l, y:M.t, width:iw, height:ih, fill:"transparent"});
  overlay.style.cursor = "crosshair";
  const tip = document.createElement("div"); tip.className="tooltip"; host.appendChild(tip);

  overlay.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W/rect.width);
    let best=0, bd=Infinity;
    xs.forEach((x,i)=>{ const dd=Math.abs(xAt(x)-px); if(dd<bd){bd=dd;best=i;} });
    const xk = xs[best], cx = xAt(xk);
    cross.setAttribute("x1",cx); cross.setAttribute("x2",cx); cross.style.opacity=1;
    let rowsHtml = "", metaHtml = "";
    SOURCES.forEach((s,si) => {
      const m = groups[s.key];
      if (m && m.has(xk)) {
        const o = m.get(xk);
        const dot = hoverDots[si];
        dot.setAttribute("cx",cx); dot.setAttribute("cy",yAt(convert(o.price)));
        dot.setAttribute("style",`fill:var(${s.varName});stroke:var(--surface-1);stroke-width:2;opacity:1`);
        rowsHtml += `<div class="tt-row"><span class="dot" style="background:var(${s.varName})"></span>${s.name}<span class="tt-price">${money(o.price)}</span></div>`;
        if (!metaHtml && o.fn) metaHtml = `<div class="tt-meta">dep ${o.dep} · ${o.fn} · ${o.air}</div>`;
      } else {
        hoverDots[si].style.opacity = 0;
      }
    });
    tip.innerHTML = `<div class="tt-date">${fmtDate(xk)} ${xk.slice(0,4)}</div>${rowsHtml}${metaHtml}`;
    tip.style.opacity = 1;
    let tx = (cx/W)*rect.width + 14; if (tx > rect.width-160) tx -= 172;
    tip.style.left = tx + "px";
    tip.style.top = (M.t*rect.height/H + 6) + "px";
  });
  overlay.addEventListener("mouseleave", () => {
    cross.style.opacity=0; tip.style.opacity=0; hoverDots.forEach(d=>d.style.opacity=0);
  });

  host.appendChild(svg);
  buildTable(tableId, xs, groups, xTitle);
}

function buildTable(id, xs, groups, xTitle) {
  const head = `<tr><th>${xTitle}</th>${SOURCES.map(s=>`<th class="num">${s.name}</th>`).join("")}</tr>`;
  const body = xs.map(x => {
    const cells = SOURCES.map(s => {
      const m = groups[s.key]; const o = m && m.get(x);
      return `<td class="num">${o ? money(o.price) : "—"}</td>`;
    }).join("");
    return `<tr><td>${fmtDate(x)} ${x.slice(0,4)}</td>${cells}</tr>`;
  }).join("");
  document.getElementById(id).innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : (cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
  document.documentElement.setAttribute("data-theme", next);
  if (CURRENT) render();
});
</script>
</body>
</html>
